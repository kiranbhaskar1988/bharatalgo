services:
  - type: web
    name: bharatalgo-master-suite
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PAPER_TRADING
        value: "true"
      - key: PORT
        value: 10000